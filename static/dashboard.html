<head>
    <link rel="stylesheet" href="dashboard.css">
    <script src="vendor/gauge.min.js"></script>
    <script src="dashboard.js" defer></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div id="overlay" class="horizontal-container footer">
        <canvas id="rpmGauge"></canvas>
        <canvas id="mphGauge"></canvas>
        <canvas id="brakeGauge"></canvas>
        <canvas id="accGauge"></canvas>

        <div class="boost-container">
            <div class="boost-label">Boost</div>
            <div class="boost-scale">
                <div id="boostPositive" class="boost-positive"></div>
                <div class="boost-zero"></div>
                <div id="boostNegative" class="boost-negative"></div>
            </div>
            <div id="boostValue" class="boost-value">
                0 PSI
            </div>
        </div>

        <div class="telemetry-table-container">
            <table class="telemetry-table">
                <tr>
                    <td class="label">Coolant</td>
                    <td id="coolantTemp" class="value">-- °C</td>

                    <td class="label">IAT</td>
                    <td id="iat" class="value">-- °C</td>
                </tr>
                <tr>
                    <td class="label">AAT</td>
                    <td id="aat" class="value">-- °C</td>

                    <td class="label">Battery</td>
                    <td id="batteryVoltage" class="value">-- V</td>
                </tr>
                <tr>
                    <td class="label">Oil Temp</td>
                    <td id="oilTemp" class="value">-- °C</td>

                    <td class="label">Oil Press</td>
                    <td id="oilPressure" class="value">-- PSI</td>
                </tr>
                <tr>
                    <td class="label">AFR</td>
                    <td id="afr" class="value">--</td>

                    <td class="label">Trans Temp</td>
                    <td id="transTemp" class="value">-- °C</td>
                </tr>
            </table>

        </div>
    </div>

</body>
